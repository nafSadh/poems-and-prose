<!DOCTYPE html><html><head><meta charset="utf-8"><title>Art preview v2</title>
<style>body{margin:0;padding:24px;background:#f4f0e6;color:#1a1208;font-family:Georgia,serif}.row{display:flex;gap:32px;flex-wrap:wrap;justify-content:center}.cell{background:#faf8f2;border:1px solid rgba(26,18,8,.14);border-radius:4px;padding:20px;text-align:center}svg{width:300px;height:300px;color:#2a6bb8;opacity:.85;display:block;margin:auto}.sm{margin-top:10px}.sm svg{width:128px;height:128px}h2{font-weight:400;font-style:italic;margin:10px 0 2px;font-size:20px}code{font-size:12px;color:#8a7a56}</style></head><body>
<svg style="display:none"><symbol id="art-parapet-fog" viewBox="0 0 80 80">
  <!-- অসমাপ্ত — reread. the moon and the tea belong to the poem's first stanza and to the neighbouring poem's art; this poem's own place is the rooftop: "at the turning of life's fourth decade, on the roof of a tall cool city building, warming at a gentle fire against the cold wind... melancholy's form stands at the parapet's edge, where existence meets the unknown in fog... the weary poet's restless daily lament sings the plea for farewell... from which enchantment will come release, the plea of poetry's" and there it stops. {অসমাপ্ত}. -->
  <!-- the parapet (ছাদের প্রাচীর): a low wall seen from the roof side, chest high. solid where the poet stands; to the right it dissolves into fog and never reaches the frame's edge. the wall is left unfinished -->
  <path d="M4 34 L44 34 L44 58 L4 58" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M4 37.5 L44 37.5" stroke="currentColor" stroke-width=".7" opacity=".45" stroke-linecap="round"/>
  <!-- coping stone joints -->
  <line x1="16" y1="34" x2="16" y2="37.5" stroke="currentColor" stroke-width=".5" opacity=".35"/>
  <line x1="30" y1="34" x2="30" y2="37.5" stroke="currentColor" stroke-width=".5" opacity=".35"/>
  <!-- the dissolving end -->
  <path d="M44 34 L54 34" stroke="currentColor" stroke-width="1.1" opacity=".55" stroke-linecap="round" stroke-dasharray="3 2"/>
  <path d="M44 37.5 L52 37.5" stroke="currentColor" stroke-width=".7" opacity=".35" stroke-linecap="round" stroke-dasharray="3 2"/>
  <path d="M44 58 L52 58" stroke="currentColor" stroke-width="1.1" opacity=".45" stroke-linecap="round" stroke-dasharray="3 2.5"/>
  <path d="M54 34 L62 34" stroke="currentColor" stroke-width="1" opacity=".3" stroke-linecap="round" stroke-dasharray="1.6 2.8"/>
  <path d="M52 58 L59 58" stroke="currentColor" stroke-width="1" opacity=".24" stroke-linecap="round" stroke-dasharray="1.6 3"/>
  <path d="M62 34 L68 34" stroke="currentColor" stroke-width=".9" opacity=".14" stroke-linecap="round" stroke-dasharray=".6 3.2"/>
  <path d="M46 44 L50 44" stroke="currentColor" stroke-width=".5" opacity=".18" stroke-linecap="round" stroke-dasharray=".6 2.6"/>
  <path d="M46 51 L49 51" stroke="currentColor" stroke-width=".5" opacity=".14" stroke-linecap="round" stroke-dasharray=".6 2.6"/>
  <!-- the roof floor, the poet's side, also fading toward the edge -->
  <path d="M4 70 L40 70" stroke="currentColor" stroke-width=".8" opacity=".45" stroke-linecap="round"/>
  <path d="M40 70 L52 70" stroke="currentColor" stroke-width=".8" opacity=".25" stroke-linecap="round" stroke-dasharray="2 2.6"/>
  <!-- the fog (কুয়াশা) beyond the wall's end, where existence meets the unknown: layered, drifting in from the right -->
  <path d="M56 28 Q64 25.5 72 28 Q76 29.4 79 28" stroke="currentColor" stroke-width=".7" fill="none" opacity=".3" stroke-linecap="round"/>
  <path d="M60 41 Q68 38.8 76 41 Q78 41.6 79 41.4" stroke="currentColor" stroke-width=".65" fill="none" opacity=".24" stroke-linecap="round"/>
  <path d="M58 52 Q66 49.6 74 52 Q77 53 79 52.4" stroke="currentColor" stroke-width=".7" fill="none" opacity=".28" stroke-linecap="round"/>
  <path d="M62 63 Q70 61 78 63" stroke="currentColor" stroke-width=".6" fill="none" opacity=".18" stroke-linecap="round"/>
  <!-- the cold wind (শীতল হাওয়া) coming over the wall from the far side -->
  <path d="M78 18 Q70 19.5 62 18" stroke="currentColor" stroke-width=".55" fill="none" opacity=".3" stroke-dasharray=".5 2.6" stroke-linecap="round"/>
  <path d="M74 23 Q68 24 63 23" stroke="currentColor" stroke-width=".5" fill="none" opacity=".24" stroke-dasharray=".5 2.6" stroke-linecap="round"/>
  <!-- the gentle fire (আলতো আগুন) the poet warms at: a low dish on the roof floor, in front of the wall -->
  <path d="M15 70 Q14 65 18.5 63.8 L29.5 63.8 Q34 65 33 70 Z" fill="currentColor" fill-opacity=".22" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19 63.8 Q16.6 58.4 20.4 54.2 Q20.8 57.8 22.8 58.6 Q22 53.4 25.4 49.6 Q25 55 27.4 57.2 Q28.8 54.2 28.2 52 Q31.8 57.4 29 63.8 Z" fill="currentColor" fill-opacity=".34" stroke="currentColor" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- its smoke, and the poem: it rises past the coping, bends in the wind, and simply stops mid-stroke. the plea of poetry's -->
  <path d="M24 49 Q21 44 24.4 39.5 Q27.6 35.4 23.8 31" stroke="currentColor" stroke-width=".75" fill="none" opacity=".5" stroke-linecap="round"/>
  <path d="M23.8 31 Q21.4 27.4 22.6 23.4" stroke="currentColor" stroke-width=".7" fill="none" opacity=".36" stroke-dasharray="2.4 2" stroke-linecap="round"/>
  <path d="M22.6 23.4 Q22 20.6 22.4 18.2" stroke="currentColor" stroke-width=".65" fill="none" opacity=".2" stroke-dasharray=".8 2.6" stroke-linecap="round"/>
</symbol><symbol id="art-unblown-candle" viewBox="0 0 80 80">
  <!-- Anguished Celebrations — reread. the poem's knot is a birthday wish he is not permitted to make: "Only thing I want is to WISH... but now I need protection from her and court has to order so" / "I wish I could wish. I wish I could do something." / "I wanted to scream so that the entire world knows. Now, I can't." a birthday wish is made by blowing out a candle. here the breath sets out, meets the line, and stops. the candle burns on, unblown, down to its own pool of wax. "this is only the middle of the end." -->
  <!-- the court's line, the order: a thin vertical, dashed, running the full height between him and her -->
  <path d="M44 5 L44 75" stroke="currentColor" stroke-width=".8" opacity=".5" stroke-dasharray="3.2 2.4" stroke-linecap="round"/>
  <!-- the breath, the wish, coming from the left. three long strokes that travel and then stop dead at the line -->
  <path d="M6 36 Q18 34.5 30 36 Q37 36.6 42.4 36.2" stroke="currentColor" stroke-width=".9" fill="none" opacity=".6" stroke-linecap="round"/>
  <path d="M10 41 Q20 39.6 30 41 Q37 41.8 42.4 41.2" stroke="currentColor" stroke-width=".8" fill="none" opacity=".48" stroke-linecap="round"/>
  <path d="M14 46 Q22 45 30 46 Q36 46.8 42.4 46.2" stroke="currentColor" stroke-width=".7" fill="none" opacity=".36" stroke-linecap="round"/>
  <!-- where each stroke hits the line it crumples back on itself a little -->
  <path d="M42.4 36.2 Q41 34.6 41.6 33" stroke="currentColor" stroke-width=".6" fill="none" opacity=".35" stroke-linecap="round"/>
  <path d="M42.4 41.2 Q40.8 42.4 41.4 44" stroke="currentColor" stroke-width=".6" fill="none" opacity=".3" stroke-linecap="round"/>
  <path d="M42.4 46.2 Q41 47.6 41.8 49" stroke="currentColor" stroke-width=".5" fill="none" opacity=".25" stroke-linecap="round"/>
  <!-- the candle, on her side, burned low. it has been lit a long time and nobody blew it out -->
  <ellipse cx="60" cy="66" rx="11" ry="2.6" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width=".9" stroke-linecap="round"/>
  <!-- the pool of wax, spread, with drips down the stub -->
  <path d="M51 63.6 Q54 60.8 60 61.2 Q66.5 60.6 69 63.6 Q66 65.4 60 65.2 Q54 65.4 51 63.6Z" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width=".7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M56.2 44 L56.2 62 L63.8 62 L63.8 44 Z" fill="currentColor" fill-opacity=".22" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M56.2 47 Q55 51 55.6 55.5 Q56 58 56.2 58.5" stroke="currentColor" stroke-width=".7" fill="none" opacity=".5" stroke-linecap="round"/>
  <path d="M63.8 45 Q65.2 49 64.6 52.4 Q64.2 54 64.6 55.6" stroke="currentColor" stroke-width=".7" fill="none" opacity=".45" stroke-linecap="round"/>
  <path d="M55.6 55.5 Q54 58 54.6 61.4" stroke="currentColor" stroke-width=".7" fill="none" opacity=".4" stroke-linecap="round"/>
  <!-- the top has melted into a cup around the wick -->
  <path d="M56.2 44 Q60 46.2 63.8 44" stroke="currentColor" stroke-width=".8" fill="none" opacity=".6" stroke-linecap="round"/>
  <line x1="60" y1="44.8" x2="60" y2="40.5" stroke="currentColor" stroke-width=".9" opacity=".7" stroke-linecap="round"/>
  <!-- the flame, perfectly upright. no breath reaches it -->
  <path d="M60 40.5 Q64.2 35.2 61.8 29.6 Q61 27.8 60.2 26.4 Q59.6 28.2 58.6 29.8 Q55.8 35.2 60 40.5Z" fill="currentColor" fill-opacity=".32" stroke="currentColor" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 39 Q61.6 36.4 60.4 33.4 Q58.6 36.2 60 39Z" fill="currentColor" fill-opacity=".38" stroke="none"/>
  <!-- the tears, 2½: falling on his side only, from very high up, like rainfall from the stratosphere -->
  <path d="M20 8 L18.6 20" stroke="currentColor" stroke-width=".55" opacity=".3" stroke-dasharray="2.6 2.6" stroke-linecap="round"/>
  <path d="M31 4 L29.8 16" stroke="currentColor" stroke-width=".55" opacity=".26" stroke-dasharray="2.6 2.6" stroke-linecap="round"/>
  <path d="M9 14 L8 26" stroke="currentColor" stroke-width=".5" opacity=".24" stroke-dasharray="2.6 2.6" stroke-linecap="round"/>
  <path d="M25 56 L24 68" stroke="currentColor" stroke-width=".5" opacity=".22" stroke-dasharray="2.6 2.6" stroke-linecap="round"/>
  <path d="M13 62 L12.2 72" stroke="currentColor" stroke-width=".5" opacity=".2" stroke-dasharray="2.6 2.6" stroke-linecap="round"/>
</symbol></svg><div class="row"><div class="cell"><svg viewBox="0 0 80 80"><use href="#art-parapet-fog"/></svg><h2>অসমাপ্ত</h2><code>art-parapet-fog</code><div class="sm"><svg viewBox="0 0 80 80"><use href="#art-parapet-fog"/></svg></div></div><div class="cell"><svg viewBox="0 0 80 80"><use href="#art-unblown-candle"/></svg><h2>Anguished Celebrations</h2><code>art-unblown-candle</code><div class="sm"><svg viewBox="0 0 80 80"><use href="#art-unblown-candle"/></svg></div></div></div></body></html>
